name: CLA
# Asks the author of each pull request to agree to CLA.md by commenting on it, once, and keeps the signatures in
# signatures/cla.json on the cla-signatures branch, which has to exist before the first pull request. Recheck by
# commenting "recheck". Only in the public repository.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    if: >-
      github.repository == 'Threennovate/spindle' && (github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/Threennovate/spindle/blob/main/CLA.md'
          path-to-signatures: 'signatures/cla.json'
          branch: 'cla-signatures'
          allowlist: 'icvitanovic,martin-sic,dependabot[bot],github-actions[bot]'
