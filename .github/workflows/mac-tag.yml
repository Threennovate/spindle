name: Mac tag
# Merging a new Mac version into main publishes it: when apple/project.yml on main names a version that has release
# notes and no tag yet, this tags the merge commit and starts Mac release for that tag. A tag pushed with the
# workflow's token doesn't start other workflows, so the release is started directly.
# Only in the public repository, so forks never tag or release.
on:
  push:
    branches: [main]
    paths: ['apple/project.yml', 'apple/ReleaseNotes/**']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: mac-tag
  cancel-in-progress: false
jobs:
  tag:
    if: github.repository == 'Threennovate/spindle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag a new version and start its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^    MARKETING_VERSION: "\([^"]*\)"/\1/p' apple/project.yml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unreadable version: $version"; exit 1; }
          tag="mac-$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          if [[ ! -s "apple/ReleaseNotes/$version.md" ]]; then
            echo "No release notes for $version yet; not releasing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Mac $version"
          git push origin "refs/tags/$tag"
          gh workflow run mac-release.yml --ref main -f tag="$tag"
          echo "Tagged $tag at $(git rev-parse HEAD) and started Mac release."
