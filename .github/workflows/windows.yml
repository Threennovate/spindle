name: Windows client

on:
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml', 'global.json', 'Directory.Build.props', 'Directory.Packages.props', 'openapi/spindle.json']
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml', 'global.json', 'Directory.Build.props', 'Directory.Packages.props', 'openapi/spindle.json']
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build Windows application
        run: dotnet build windows/Spindle.Windows/Spindle.Windows.csproj -c Release
      - name: Core contract and rule checks
        run: dotnet run --project windows/Spindle.Core.Tests/Spindle.Core.Tests.csproj -c Release
      - name: Activity rules and parser checks
        run: dotnet run --project windows/Spindle.Activity.Tests -c Release
      - name: Native UI checks
        run: dotnet run --project windows/Spindle.Windows.Tests -c Release
      - name: Native Windows platform checks
        run: dotnet run --project windows/scripts/PlatformSmoke/PlatformSmoke.csproj -c Release
      - name: Publish x64
        shell: pwsh
        run: ./windows/scripts/publish.ps1 -Runtime win-x64
      - name: Publish ARM64
        shell: pwsh
        run: ./windows/scripts/publish.ps1 -Runtime win-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: spindle-windows-x64
          path: windows/artifacts/win-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: spindle-windows-arm64
          path: windows/artifacts/win-arm64/
