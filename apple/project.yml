# The Xcode project for the Apple apps, generated by XcodeGen: `xcodegen` in this folder writes Spindle.xcodeproj.
name: Spindle
options:
  bundleIdPrefix: com.spindletrack
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.5.0"
    CURRENT_PROJECT_VERSION: "1"
    # Threennovate d.o.o. (not the Apple ID's free Personal Team, which can't make Ad Hoc or Developer ID builds).
    DEVELOPMENT_TEAM: 9ARDA688G5
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  SpindleKit:
    path: SpindleKit
  # Updates the app from its server's downloads (see docs/releasing.md).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  SpindleMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes:
          - Snapshots/Fixtures
      # What the Mac and iPhone apps share: the model, the brand and a few views.
      - path: Shared
    dependencies:
      - package: SpindleKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Spindle
        PRODUCT_BUNDLE_IDENTIFIER: com.spindletrack.mac
        INFOPLIST_FILE: Mac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mac/Resources/Spindle.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        # The Developer ID profile a release signs the app with (scripts/release-mac.sh).
        PROVISIONING_PROFILE_SPECIFIER: $(SPINDLE_MAC_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        # App code runs on the main actor unless it says otherwise, as in Xcode's own app template.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # The public half of the key that signs updates, as Sparkle's generate_keys prints it. The private half stays
        # in the keychain of the Mac that makes releases. Without it the app doesn't look for updates.
        SPINDLE_UPDATES_PUBLIC_KEY: ""
      configs:
        Debug:
          # A development certificate keeps the signature the same from build to build, so the Keychain goes on
          # trusting the app with its sign-in instead of asking each time.
          CODE_SIGN_IDENTITY: Apple Development
          # While developing, the API on this Mac.
          SPINDLE_SERVER_URL: http://localhost:5258
          # While developing, the web app runs on its own dev server.
          SPINDLE_WEB_URL: http://localhost:5173
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          # Spindle Cloud: the server the app starts with. On the Mac, people can choose their own when they sign in.
          SPINDLE_SERVER_URL: https://app.spindletrack.com
          # Addresses Spindle Cloud had before, separated by spaces, if it ever moves. An app that signed in at one of
          # them moves its sign-in to the address above (see `AppModel.followCloud`).
          SPINDLE_FORMER_SERVER_URLS: ""
          # The server also serves the web app.
          SPINDLE_WEB_URL: ""
  SpindleMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacTests
    dependencies:
      - target: SpindleMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # The same signer as the app, which the hardened runtime requires to load the tests into it.
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Manual
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Spindle.app/Contents/MacOS/Spindle
  SpindleiOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      # The Live Activity's data and stop intent, shared with the widget extension.
      - path: LiveActivity
    dependencies:
      - package: SpindleKit
      - target: SpindleWidgets
    settings:
      base:
        PRODUCT_NAME: Spindle
        PRODUCT_BUNDLE_IDENTIFIER: com.spindletrack.iphone
        INFOPLIST_FILE: iOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Resources/Spindle.entitlements
        # iPhone only; an iPad runs it as an iPhone app.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
      configs:
        Debug:
          # While developing, the API on this Mac, which the simulator reaches as localhost.
          SPINDLE_SERVER_URL: http://localhost:5258
          SPINDLE_WEB_URL: http://localhost:5173
        Release:
          # Spindle Cloud: the server the app starts with. On the Mac, people can choose their own when they sign in.
          SPINDLE_SERVER_URL: https://app.spindletrack.com
          SPINDLE_FORMER_SERVER_URLS: ""
          SPINDLE_WEB_URL: ""
  # Draws the running timer's Live Activity; the app starts, updates and ends it.
  SpindleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: LiveActivity
      - path: Shared/UI/Brand.swift
      - path: Shared/Resources/Shared.xcassets
    settings:
      base:
        PRODUCT_NAME: SpindleWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.spindletrack.iphone.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  SpindleiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSTests
    dependencies:
      - target: SpindleiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Spindle.app/Spindle
  # Drive the app in the simulator against the API on this Mac.
  SpindleiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOSUITests
    dependencies:
      - target: SpindleiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpindleiOS
schemes:
  SpindleiOS:
    build:
      targets:
        SpindleiOS: all
    test:
      targets:
        - SpindleiOSTests
        - SpindleiOSUITests
    run:
      config: Debug
    archive:
      config: Release
  SpindleMac:
    build:
      targets:
        SpindleMac: all
    test:
      targets:
        - SpindleMacTests
    run:
      config: Debug
    archive:
      config: Release
