# Local PostgreSQL and mail catcher for development and integration tests. Started by scripts/local-db.sh.
name: spindle

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: Spindle
      POSTGRES_USER: spindle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env (scripts/local-db.sh creates it)}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spindle -d Spindle"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Catches every email the app sends in development; read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
